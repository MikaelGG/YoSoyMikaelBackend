# ===============================================
# Configuración del Servidor (Optimizado para AWS & Local)
# ===============================================
server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# ===============================================
# Configuración de Spring & Base de Datos
# ===============================================
spring:
  application:
    name: YoSoyBackend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yosoymikael}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:88888888}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

# ===============================================
# Logging
# ===============================================
logging:
  level:
    org.springframework.web: ${LOG_WEB:INFO}
    org.hibernate.SQL: ${LOG_SQL:WARN}
