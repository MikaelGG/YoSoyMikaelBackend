# ===============================================
# Configuración del Servidor
# ===============================================
server:
  port: 8080

# ===============================================
# Configuración de Spring & Base de Datos
# ===============================================
spring:
  application:
    name: YoSoyBackend

  datasource:
    url: jdbc:postgresql://localhost:5432/yosoymikael
    username: postgres
    password: 88888888
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# ===============================================
# Logging
# ===============================================
logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
